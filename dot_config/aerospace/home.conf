# home コマンドで使うウィンドウの定位置 (メイン PC 用)
#
# 書式: <bundle-id> <workspace>
#   - bundle id は `aerospace list-apps` で調べられる
#   - 起動していないアプリは無視される
#   - "#" 以降はコメント、空行は無視する
#   - ~/.aerospace_home_local に有効な行があれば、このファイルは使われない
#   - 編集は `home --edit` で行う

com.google.Chrome              1
com.github.wez.wezterm         2
com.anthropic.claudefordesktop 2
md.obsidian                    3
com.openai.codex               4  # ChatGPT
